<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港樓花計算器</title>
    <style>
        /* 全局样式重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 模拟iPhone手机外壳 */
        .phone-mockup {
            width: 375px;
            height: 812px;
            background-color: #000;
            border-radius: 40px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        /* 手机顶部刘海 */
        .phone-notch {
            width: 160px;
            height: 30px;
            background-color: #000;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* 手机状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 14px;
            padding: 5px 10px;
            margin-bottom: 10px;
        }

        /* 计算器主容器 */
        .calculator-container {
            background-color: #fff;
            border-radius: 20px;
            padding: 25px 20px;
            flex: 1;
            overflow-y: auto;
        }

        /* 标题样式 */
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 30px;
        }

        /* 输入框区域 */
        .input-section {
            margin-bottom: 35px;
        }

        .input-label {
            font-size: 15px;
            color: #86868b;
            margin-bottom: 8px;
            display: block;
        }

        #price-input {
            width: 100%;
            padding: 15px 12px;
            border: 1px solid #e6e6e6;
            border-radius: 12px;
            font-size: 20px;
            color: #1d1d1f;
            outline: none;
            transition: border-color 0.2s;
        }

        #price-input:focus {
            border-color: #0071e3;
        }

        /* 结果区域 */
        .result-section {
            margin-bottom: 35px;
        }

        .result-title {
            font-size: 15px;
            color: #86868b;
            margin-bottom: 15px;
            display: block;
        }

        .result-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 15px;
            background-color: #f9f9fb;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .result-label {
            font-size: 16px;
            color: #1d1d1f;
            font-weight: 400;
        }

        .result-value {
            font-size: 18px;
            color: #0071e3;
            font-weight: 600;
        }

        /* 备注区域 */
        .note-section {
            padding: 15px;
            background-color: #f0f0f5;
            border-radius: 12px;
        }

        .note-title {
            font-size: 15px;
            color: #86868b;
            margin-bottom: 8px;
            display: block;
        }

        .note-text {
            font-size: 14px;
            color: #424245;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="phone-mockup">
        <div class="phone-notch"></div>
        <div class="status-bar">
            <span>10:01</span>
            <span> </span>
        </div>
        <div class="calculator-container">
            <h1>樓價與印花稅計算</h1>
            
            <!-- 输入区域 -->
            <div class="input-section">
                <label class="input-label">輸入樓宇價錢</label>
                <input type="number" id="price-input" placeholder="請輸入樓價金額" value="4000000">
            </div>

            <!-- 计算结果区域 -->
            <div class="result-section">
                <span class="result-title">計算結果</span>
                <div class="result-card">
                    <span class="result-label">今天 5%樓價</span>
                    <span class="result-value" id="five-percent">HK$200,000</span>
                </div>
                <div class="result-card">
                    <span class="result-label">5天內 印花稅</span>
                    <span class="result-value" id="stamp-duty">HK$100</span>
                </div>
                <div class="result-card">
                    <span class="result-label">120天 95%樓價</span>
                    <span class="result-value" id="ninetyfive-percent">HK$3,800,000</span>
                </div>
            </div>

            <!-- 备注区域 -->
            <div class="note-section">
                <span class="note-title">備註</span>
                <p class="note-text">印花稅按照香港AVD Scale 2 (2025-02-26 生效) 計算，並四捨五入至最接近的$1。</p>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const priceInput = document.getElementById('price-input');
        const fivePercentEl = document.getElementById('five-percent');
        const stampDutyEl = document.getElementById('stamp-duty');
        const ninetyfivePercentEl = document.getElementById('ninetyfive-percent');

        // 格式化金额为香港货币格式
        function formatHKD(amount) {
            return `HK$${amount.toLocaleString('zh-HK')}`;
        }

        // 计算逻辑
        function calculate() {
            const price = Number(priceInput.value) || 0;
            const fivePercent = price * 0.05;
            const ninetyfivePercent = price * 0.95;
            // 印花稅示例值（可根据实际AVD Scale 2规则修改）
            const stampDuty = 100; 

            // 更新页面显示
            fivePercentEl.textContent = formatHKD(fivePercent);
            stampDutyEl.textContent = formatHKD(stampDuty);
            ninetyfivePercentEl.textContent = formatHKD(ninetyfivePercent);
        }

        // 初始计算 + 输入变化时重新计算
        calculate();
        priceInput.addEventListener('input', calculate);
    </script>
</body>
</html>
