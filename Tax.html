<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港樓花印花稅計算器</title>
    <style>
        /* 全局样式重置与iOS风格基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 计算器主容器 */
        .calculator {
            width: 100%;
            max-width: 375px;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* 标题样式 */
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 32px;
            text-align: center;
        }

        /* 输入区域 */
        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 8px;
            display: block;
        }

        #property-price {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #e6e6e6;
            border-radius: 12px;
            font-size: 20px;
            color: #1d1d1f;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #property-price:focus {
            border-color: #0071e3;
        }

        /* 结果区域 */
        .result-group {
            margin-bottom: 30px;
        }

        .result-title {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 16px;
            display: block;
        }

        .result-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 16px;
            background-color: #f9f9fb;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .result-desc {
            font-size: 16px;
            color: #1d1d1f;
        }

        .result-value {
            font-size: 18px;
            color: #0071e3;
            font-weight: 600;
        }

        /* 备注区域 */
        .note-box {
            padding: 18px 16px;
            background-color: #f0f0f5;
            border-radius: 12px;
        }

        .note-title {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 8px;
            display: block;
        }

        .note-text {
            font-size: 13px;
            color: #424245;
            line-height: 1.6;
        }

        /* 响应式适配 */
        @media (max-width: 375px) {
            .calculator {
                border-radius: 0;
                height: 100vh;
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>樓價與印花稅計算</h1>

        <!-- 楼价输入区域 -->
        <div class="input-group">
            <label class="input-label">輸入樓宇價錢 (HK$)</label>
            <input type="number" id="property-price" placeholder="請輸入樓價金額" value="9000000" min="0">
        </div>

        <!-- 计算结果区域 -->
        <div class="result-group">
            <span class="result-title">計算結果</span>
            <div class="result-card">
                <span class="result-desc">今天 5%樓價</span>
                <span class="result-value" id="five-percent-amount">HK$450,000</span>
            </div>
            <div class="result-card">
                <span class="result-desc">5天內 印花稅 (AVD)</span>
                <span class="result-value" id="stamp-duty-amount">HK$270,000</span>
            </div>
            <div class="result-card">
                <span class="result-desc">120天 95%樓價</span>
                <span class="result-value" id="ninetyfive-percent-amount">HK$8,550,000</span>
            </div>
        </div>

        <!-- 备注说明 -->
        <div class="note-box">
            <span class="note-title">備註</span>
            <p class="note-text">印花稅按照香港AVD Scale 2 (2025-02-26 生效) 計算，稅率按樓價分級累進計算，結果已四捨五入至最接近的$1。</p>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const priceInput = document.getElementById('property-price');
        const fivePercentEl = document.getElementById('five-percent-amount');
        const stampDutyEl = document.getElementById('stamp-duty-amount');
        const ninetyfivePercentEl = document.getElementById('ninetyfive-percent-amount');

        /**
         * 格式化金额为香港货币格式
         * @param {number} amount - 金额数字
         * @returns {string} 格式化后的HK$字符串
         */
        function formatHKD(amount) {
            return `HK$${Math.round(amount).toLocaleString('zh-HK')}`;
        }

        /**
         * 根据2025 AVD Scale 2计算印花税
         * @param {number} price - 楼价
         * @returns {number} 印花税金额
         */
        function calculateAVD(price) {
            let duty = 0;
            const tiers = [
                { max: 4000000, rate: 0.00025 }, // 400万或以下：0.025%
                { max: 6642857, rate: 0.015 },   // 400万-664.2857万：1.5%
                { max: 9000000, rate: 0.03 },    // 664.2857万-900万：3%
                { max: 20000000, rate: 0.04 },   // 900万-2000万：4%
                { max: Infinity, rate: 0.05 }    // 2000万以上：5%
            ];

            // 按分级税率计算
            if (price <= tiers[0].max) {
                duty = price * tiers[0].rate;
            } else if (price <= tiers[1].max) {
                duty = 4000000 * tiers[0].rate + (price - 4000000) * tiers[1].rate;
            } else if (price <= tiers[2].max) {
                duty = 4000000 * tiers[0].rate + (6642857 - 4000000) * tiers[1].rate + (price - 6642857) * tiers[2].rate;
            } else if (price <= tiers[3].max) {
                duty = 4000000 * tiers[0].rate + (6642857 - 4000000) * tiers[1].rate + (9000000 - 6642857) * tiers[2].rate + (price - 9000000) * tiers[3].rate;
            } else {
                duty = 4000000 * tiers[0].rate + (6642857 - 4000000) * tiers[1].rate + (9000000 - 6642857) * tiers[2].rate + (20000000 - 9000000) * tiers[3].rate + (price - 20000000) * tiers[4].rate;
            }

            return duty;
        }

        /**
         * 主计算函数
         */
        function calculateAll() {
            const price = Number(priceInput.value) || 0;
            const fivePercent = price * 0.05;
            const ninetyfivePercent = price * 0.95;
            const stampDuty = calculateAVD(price);

            // 更新页面显示
            fivePercentEl.textContent = formatHKD(fivePercent);
            stampDutyEl.textContent = formatHKD(stampDuty);
            ninetyfivePercentEl.textContent = formatHKD(ninetyfivePercent);
        }

        // 初始计算 + 输入变化时重新计算
        calculateAll();
        priceInput.addEventListener('input', calculateAll);
    </script>
</body>
</html>
